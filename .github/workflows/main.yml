name: Build HisabBoi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract HisabBoi project
        run: |
          mkdir -p project
          unzip -q "hisabboi (5).zip" -d project
      - name: Find Android project
        run: |
          SETTINGS=$(find project -name settings.gradle.kts -type f | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found at: $PROJECT_DIR"

      - name: Read Gradle version
        run: |
          PROPERTIES="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$PROPERTIES" ]; then
            echo "gradle-wrapper.properties not found"
            exit 1
          fi

          URL=$(grep 'distributionUrl=' "$PROPERTIES" | cut -d'=' -f2- | sed 's/\\//g')
          echo "GRADLE_URL=$URL" >> "$GITHUB_ENV"

      - name: Download Gradle
        run: |
          mkdir -p "$HOME/gradle"
          wget -q "$GRADLE_URL" -O "$HOME/gradle/gradle.zip"
          unzip -q "$HOME/gradle/gradle.zip" -d "$HOME/gradle"

          GRADLE_BIN=$(find "$HOME/gradle" -type f -path "*/bin/gradle" | head -1)

          if [ -z "$GRADLE_BIN" ]; then
            echo "Gradle executable not found"
            exit 1
          fi

          echo "GRADLE_BIN=$GRADLE_BIN" >> "$GITHUB_ENV"

      - name: Create debug keystore
        run: |
          mkdir -p "$PROJECT_DIR/app"

          keytool -genkeypair \
            -v \
            -keystore "$PROJECT_DIR/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          "$GRADLE_BIN" assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        run: |
          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload HisabBoi APK
        uses: actions/upload-artifact@v4
        with:
          name: HisabBoi-APK-${{ github.run_number }}
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
