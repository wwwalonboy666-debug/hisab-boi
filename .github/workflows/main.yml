name: Build HisabBoi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract HisabBoi project
        run: |
          mkdir -p project
          unzip -q "hisabboi (5).zip" -d project

      - name: Find Android project
        run: |
          SETTINGS=$(find project -name settings.gradle.kts -type f | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found at: $PROJECT_DIR"

      - name: Disable KSP Daemon
        run: |
          echo "ksp.incremental=false" >> "$PROJECT_DIR/gradle.properties"
          echo "ksp.use.daemon=false" >> "$PROJECT_DIR/gradle.properties"

      - name: Read Gradle version
        run: |
          PROPERTIES="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$PROPERTIES" ]; then
            echo "gradle-wrapper.properties not found"
            exit 1
          fi

          DIST_URL=$(grep "distributionUrl" "$PROPERTIES" | cut -d'=' -f2 | tr -d '\r')
          GRADLE_VERSION=$(echo "$DIST_URL" | sed -n 's/.*gradle-\([0-9.]*\)-.*/\1/p')

          if [ -z "$GRADLE_VERSION" ]; then
            echo "Could not parse Gradle version"
            exit 1
          fi

          echo "GRADLE_VERSION=$GRADLE_VERSION" >> "$GITHUB_ENV"
          echo "Detected Gradle version: $GRADLE_VERSION"

      - name: Download Gradle
        run: |
          GRADLE_DIR="$HOME/gradle-$GRADLE_VERSION"
          mkdir -p "$GRADLE_DIR"

          wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -O "$HOME/gradle.zip"
          unzip -q "$HOME/gradle.zip" -d "$HOME"

          GRADLE_BIN=$(find "$HOME/gradle-$GRADLE_VERSION" -type f -name gradle | head -n 1)

          if [ -z "$GRADLE_BIN" ]; then
            echo "Gradle executable not found"
            exit 1
          fi

          echo "GRADLE_BIN=$GRADLE_BIN" >> "$GITHUB_ENV"

      - name: Create debug keystore
        run: |
          mkdir -p "$PROJECT_DIR/app"

          keytool -genkeypair \
            -v \
            -keystore "$PROJECT_DIR/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          "$GRADLE_BIN" assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        run: |
          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload HisabBoi APK
        uses: actions/upload-artifact@v4
        with:
          name: HisabBoi-APK-${{ github.run_number }}
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error          -Pksp.use.daemon=false \
            --no-daemon \
            --stacktrace

      - name: Find APK
        run: |
          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload HisabBoi APK
        uses: actions/upload-artifact@v4
        with:
          name: HisabBoi-APK-${{ github.run_number }}
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
